[project]
name = "ai"
version = "0.1.0"
description = "A FastAPI application running on Cloudflare Workers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi", "pydantic-settings", "python-dotenv", "google-genai"]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]

[tool.pyright]
include = ["app"]
extraPaths = ["."]